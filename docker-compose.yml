version: '3.8'

networks:
  card-network:
    driver: bridge

volumes:
  db-data:

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    networks:
      - card-network
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: banking_db
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 5

  card-backend-1:
    build:
      context: ../CardAPIServer
      dockerfile: ../LOADbalancer/Dockerfile.backend
    container_name: card-backend-1
    networks:
      - card-network
    environment:
      - SERVER_PORT=8080
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASSWORD=secret
      - DB_NAME=banking_db
    ports:
      - "8080:8080"
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  card-backend-2:
    build:
      context: ../CardAPIServer
      dockerfile: ../LOADbalancer/Dockerfile.backend
    container_name: card-backend-2
    networks:
      - card-network
    environment:
      - SERVER_PORT=8081
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASSWORD=secret
      - DB_NAME=banking_db
    ports:
      - "8081:8081"
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  card-backend-3:
    build:
      context: ../CardAPIServer
      dockerfile: ../LOADbalancer/Dockerfile.backend
    container_name: card-backend-3
    networks:
      - card-network
    environment:
      - SERVER_PORT=8082
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASSWORD=secret
      - DB_NAME=banking_db
    ports:
      - "8082:8082"
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  card-backend-4:
    build:
      context: ../CardAPIServer
      dockerfile: ../LOADbalancer/Dockerfile.backend
    container_name: card-backend-4
    networks:
      - card-network
    environment:
      - SERVER_PORT=8083
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASSWORD=secret
      - DB_NAME=banking_db
    ports:
      - "8083:8083"
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  card-backend-5:
    build:
      context: ../CardAPIServer
      dockerfile: ../LOADbalancer/Dockerfile.backend
    container_name: card-backend-5
    networks:
      - card-network
    environment:
      - SERVER_PORT=8084
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASSWORD=secret
      - DB_NAME=banking_db
    ports:
      - "8084:8084"
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  card-lb:
    build:
      context: .
      dockerfile: Dockerfile.loadbalancer
    container_name: card-lb
    networks:
      - card-network
    environment:
      - LB_PORT=5649
      - LB_ADMIN_PORT=5650
      - BACKENDS=card-backend-1:8080,card-backend-2:8081,card-backend-3:8082,card-backend-4:8083,card-backend-5:8084
      - HEALTH_CHECK_INTERVAL=3
    ports:
      - "5649:5649"
      - "5650:5650"
    depends_on:
      card-backend-1:
        condition: service_healthy
      card-backend-2:
        condition: service_healthy
      card-backend-3:
        condition: service_healthy
      card-backend-4:
        condition: service_healthy
      card-backend-5:
        condition: service_healthy
